<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Dashboard Admin — Portal SMA Negeri 1 Gebog</title>
<meta name="description" content="Dashboard Admin/Developer: statistik sekolah, statistik CBT, dan akses ke manajemen sistem.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">
<a href="#main" class="skip-link">Lompat ke konten utama</a>

<header class="portal-header">
  <div class="brand">
    <div class="crest" aria-hidden="true"><img src="assets/logo-sman1-gebog.png" alt="Logo SMA Negeri 1 Gebog" width="40" height="40"></div>
    <div class="brand-text">
      <div class="name">SMA NEGERI 1 GEBOG</div>
      <div class="tag" id="portalTag">Portal Admin</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeToggle" aria-label="Ganti tema gelap/terang">🌙</button>
    <button class="icon-btn" id="logoutBtn" aria-label="Keluar dari akun">🚪</button>
  </div>
</header>

<main id="main" class="portal-main">

  <!-- Greeting -->
  <div class="dash-greeting">
    <h1 id="greetingName">Halo! 👋</h1>
    <p id="greetingSub">—</p>
  </div>

  <!-- Profil singkat -->
  <div class="profile-card" id="profileCard">
    <div class="staff-photo" id="profileAvatar" aria-hidden="true">?</div>
    <div class="profile-card-body">
      <h2 id="profileName">—</h2>
      <div class="profile-card-meta">
        <span id="profileMetaRole">—</span>
      </div>
    </div>
    <span class="role-badge" id="roleBadge">Admin</span>
  </div>

  <!-- Quick access -->
  <nav class="dash-quick" aria-label="Akses cepat portal Admin">
    <a href="manajemen-website.html">
      <span class="qa-icon" style="width:38px;height:38px;border-radius:50%;background:var(--blue-100);color:var(--blue-600);display:flex;align-items:center;justify-content:center;">🖥️</span>
      <span>Website</span>
    </a>
    <a href="manajemen-pengguna.html">
      <span class="qa-icon" style="width:38px;height:38px;border-radius:50%;background:var(--blue-100);color:var(--blue-600);display:flex;align-items:center;justify-content:center;">👥</span>
      <span>Pengguna</span>
    </a>
    <a href="pengaturan-sistem.html">
      <span class="qa-icon" style="width:38px;height:38px;border-radius:50%;background:var(--blue-100);color:var(--blue-600);display:flex;align-items:center;justify-content:center;">⚙️</span>
      <span>Sistem</span>
    </a>
    <a href="#cbtSection">
      <span class="qa-icon" style="width:38px;height:38px;border-radius:50%;background:var(--blue-100);color:var(--blue-600);display:flex;align-items:center;justify-content:center;">📝</span>
      <span>CBT</span>
    </a>
  </nav>

  <!-- Statistik sekolah -->
  <section class="dash-section" id="statsSection">
    <div class="dash-section-head">
      <h2>📊 Statistik Sekolah</h2>
    </div>
    <div class="card-surface" style="padding:4px 14px;">
      <div id="statsList"></div>
    </div>
  </section>

  <!-- Statistik CBT -->
  <section class="dash-section" id="cbtSection">
    <div class="dash-section-head">
      <h2>📝 Statistik CBT</h2>
      <a href="manajemen-website.html#cbt">Detail</a>
    </div>
    <div class="card-surface" style="padding:4px 14px;">
      <div id="cbtStatsList"></div>
    </div>
  </section>

</main>

<nav class="bottom-nav" aria-label="Navigasi portal Admin">
  <a class="bn-item active" href="#main"><span class="bn-icon">🏠</span>Beranda</a>
  <a class="bn-item" href="manajemen-website.html"><span class="bn-icon">🖥️</span>Website</a>
  <a class="bn-item" href="manajemen-pengguna.html"><span class="bn-icon">👥</span>Pengguna</a>
  <a class="bn-item" href="pengaturan-sistem.html"><span class="bn-icon">⚙️</span>Sistem</a>
  <a class="bn-item" href="#profileCard"><span class="bn-icon">👤</span>Profil</a>
</nav>

<script>
  const themeBtn = document.getElementById("themeToggle");
  themeBtn.addEventListener("click", () => {
    const isDark = document.body.getAttribute("data-theme") === "dark";
    document.body.setAttribute("data-theme", isDark ? "light" : "dark");
    themeBtn.textContent = isDark ? "🌙" : "☀️";
  });
</script>
<script type="module">
  import { initDashboardAdmin } from "./js/dashboard-admin.js";
  initDashboardAdmin();
</script>
</body>
</html>
