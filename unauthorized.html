<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Akses Ditolak — SMA Negeri 1 Gebog</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">

<header class="auth-header">
  <a href="index.html" class="brand" style="text-decoration:none;">
    <div class="crest" aria-hidden="true"><img src="assets/logo-sman1-gebog.png" alt="Logo SMA Negeri 1 Gebog" width="40" height="40"></div>
    <div class="brand-text">
      <div class="name">SMA NEGERI 1 GEBOG</div>
      <div class="tag">Portal Internal</div>
    </div>
  </a>
  <button class="icon-btn" id="themeToggle" aria-label="Ganti tema gelap/terang">🌙</button>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-icon" aria-hidden="true" style="background:#fdeaea;color:var(--danger);" id="deniedIcon">🚫</div>
    <h1 id="deniedTitle">Akses Ditolak</h1>
    <p class="auth-sub" id="deniedText">Akun Anda tidak memiliki izin untuk membuka halaman ini. Jika menurut Anda ini keliru, hubungi Admin atau Tata Usaha sekolah.</p>
    <a href="login.html" class="btn-primary btn-block" style="justify-content:center;margin-bottom:10px;" id="deniedPrimaryLink">Masuk dengan Akun Lain</a>
    <a href="index.html" class="btn-secondary btn-block" style="justify-content:center;">Kembali ke Beranda</a>
  </div>
</main>

<script type="module">
  import { logout } from "./js/auth.js";

  document.getElementById("themeToggle").addEventListener("click", () => {
    const isDark = document.body.getAttribute("data-theme") === "dark";
    document.body.setAttribute("data-theme", isDark ? "light" : "dark");
    document.getElementById("themeToggle").textContent = isDark ? "🌙" : "☀️";
  });

  // Pesan khusus mode pemeliharaan (Pengaturan Sistem/30) — bukan pelanggaran
  // permission biasa, jadi pesan & aksinya dibedakan (bukan "akses ditolak").
  const reason = new URLSearchParams(location.search).get("reason");
  if (reason === "maintenance") {
    document.getElementById("deniedIcon").textContent = "🛠️";
    document.getElementById("deniedIcon").style.background = "var(--blue-100)";
    document.getElementById("deniedIcon").style.color = "var(--blue-600)";
    document.getElementById("deniedTitle").textContent = "Sedang Pemeliharaan";
    document.getElementById("deniedText").textContent = "Portal internal sedang dalam mode pemeliharaan oleh Admin/Developer. Silakan coba lagi beberapa saat lagi.";
    const primaryLink = document.getElementById("deniedPrimaryLink");
    primaryLink.textContent = "Keluar dari Akun";
    primaryLink.removeAttribute("href");
    primaryLink.style.cursor = "pointer";
    primaryLink.addEventListener("click", async () => {
      await logout();
      location.href = "login.html";
    });
  }
</script>
</body>
</html>
